[pytest]
# 命令行参数
addopts = -v --alluredir=reports/allure-result --clean-alluredir

# 测试用例目录
testpaths = testcases

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记
markers =
    smoke: 冒烟测试用例
    user: 用户模块
    product: 商品模块
    cart: 购物车模块
    order: 订单模块
    coupon: 优惠券模块
    negative: 异常用例
